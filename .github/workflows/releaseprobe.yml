name: Release Probe

on:
  workflow_run:
    workflows: ["Playwright Tests"]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: context
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "wr_head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "wr_head_sha=${{ github.event.workflow_run.head_sha }}"
          echo "wr_head_repo=${{ github.event.workflow_run.head_repository.full_name }}"
          git log -1 --format='HEAD=%H %s'
          echo "canary=$(cat CANARY 2>/dev/null || echo ABSENT)"
