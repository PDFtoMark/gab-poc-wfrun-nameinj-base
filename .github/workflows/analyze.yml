name: Auto Analyze Build Failures
on:
  workflow_run:
    workflows: ["*"]
    types: [completed]
permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: read
jobs:
  analyze-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.name != 'Auto Analyze Build Failures' }}
    steps:
      - name: Event context
        run: |
          echo "trigger-name=[${{ github.event.workflow_run.name }}]"
          echo "head-branch=[${{ github.event.workflow_run.head_branch }}]"
          echo "actor=[${{ github.actor }}]"
      - name: Check for existing remediation issue
        id: check-issue
        run: |
          workflow_name="${{ github.event.workflow_run.name }}"
          echo "constructed-workflow-name=$workflow_name"
          echo "existing_issue=" >> $GITHUB_OUTPUT
      - name: Proof of command execution
        run: |
          echo "--- workspace ---"
          ls -la
          echo "--- marker ---"
          cat pwned_by_name.txt || echo "NO-MARKER"
